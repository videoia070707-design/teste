services:
  - type: web
    name: automation-web
    runtime: docker
    region: virginia
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SERVICE
        value: '@automation/web'
      - key: PORT
        value: '10000'
      - key: APP_ORIGIN
        fromService:
          type: web
          name: automation-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://cqtrigqlktekczbbsxiy.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_AUTH_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: '3'
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
