name: RC18 Runtime Browser Database Qualification V3

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-runtime-browser-database-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    name: Exact RC18 runtime + browser + database drills v3
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct and apply exact RC18 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in
            0) ;;
            2) encoded="${encoded}==" ;;
            3) encoded="${encoded}=" ;;
            *) echo "invalid base64 length ${#encoded}"; exit 91 ;;
          esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -t "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18-core.patch.gz" > "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary "$RUNNER_TEMP/rc18-core.patch"
          test -f scripts/test-battery-runner.mjs
          test -f apps/worker-automation/package.json

      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile

      - name: Start PostgreSQL 17 and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-runtime-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for attempt in $(seq 1 60); do
            docker exec rc18-runtime-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rc18-runtime-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-runtime-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          test "$latest" = '078_transactional_local_upgrade.sql'

      - name: Build RC18
        run: pnpm build

      - name: Start worker and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-actions-runtime-proof-v3' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker-automation.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"

      - name: Capture startup diagnostics
        id: startup
        shell: bash
        run: |
          set +e
          mkdir -p qualification/results
          healthy=0
          live=000; ready=000; local_status=000; heartbeat=missing
          for attempt in $(seq 1 90); do
            live="$(curl -sS -o /tmp/live.json -w '%{http_code}' "$APP_ORIGIN/api/health/live" 2>/dev/null || true)"
            ready="$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$APP_ORIGIN/api/health/ready" 2>/dev/null || true)"
            local_status="$(curl -sS -o /tmp/local-status.json -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" 2>/dev/null || true)"
            heartbeat="$(docker exec rc18-runtime-db psql -U postgres -d automation_runtime -Atqc \"select coalesce((select runtime_state||'|'||(last_seen_at>=now()-interval '30 seconds')::text from app_private.worker_heartbeats where worker_kind='worker-automation' and worker_id='github-actions-runtime-proof-v3' order by last_seen_at desc limit 1),'missing');\" 2>/dev/null || true)"
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$local_status" = 200 ] && [[ "$heartbeat" == active\|true ]]; then healthy=1; break; fi
            sleep 1
          done
          LIVE_CODE="$live" READY_CODE="$ready" LOCAL_STATUS_CODE="$local_status" HEARTBEAT="$heartbeat" HEALTHY="$healthy" RUNNER_TEMP_VALUE="$RUNNER_TEMP" node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return fs.readFileSync(p,'utf8')}catch{return ''}};
          const t=process.env.RUNNER_TEMP_VALUE;
          const r={schemaVersion:1,healthy:process.env.HEALTHY==='1',liveCode:process.env.LIVE_CODE,readyCode:process.env.READY_CODE,localStatusCode:process.env.LOCAL_STATUS_CODE,heartbeat:process.env.HEARTBEAT,liveBody:read('/tmp/live.json'),readyBody:read('/tmp/ready.json'),localStatusBody:read('/tmp/local-status.json'),webLog:read(t+'/web.log').slice(-12000),workerLog:read(t+'/worker-automation.log').slice(-12000),generatedAt:new Date().toISOString()};
          fs.writeFileSync('qualification/results/runtime-startup-v3.json',JSON.stringify(r,null,2)+'\n');console.log(JSON.stringify(r,null,2));
          NODE
          echo "healthy=$healthy" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run official RC18 Test Center
        id: battery
        if: always()
        shell: bash
        run: |
          set +e
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/rc18-test-runs"
          mkdir -p "$OUT"
          export BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          echo "runner_exit=$?" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "output_root=$OUT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish runtime browser database evidence
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.battery.outputs.run_id }}
          OUT: ${{ steps.battery.outputs.output_root }}
          STARTUP_HEALTHY: ${{ steps.startup.outputs.healthy }}
        run: |
          set -euo pipefail
          mkdir -p qualification/results
          RUNNER_TEMP_VALUE="$RUNNER_TEMP" node - "$OUT" "$RUN_ID" <<'NODE'
          const fs=require('fs'),path=require('path');const [out,runId]=process.argv.slice(2);const read=p=>{try{return fs.readFileSync(p,'utf8')}catch{return ''}};
          const r={schemaVersion:3,stage:'runtime-browser-database',status:'FAIL',runId:runId||null,startupHealthy:process.env.STARTUP_HEALTHY==='1',generatedAt:new Date().toISOString(),checks:{},logs:{web:read(process.env.RUNNER_TEMP_VALUE+'/web.log').slice(-12000),worker:read(process.env.RUNNER_TEMP_VALUE+'/worker-automation.log').slice(-12000)}};
          const p=out&&runId?path.join(out,runId,'status.json'):null;
          if(p&&fs.existsSync(p)){const s=JSON.parse(fs.readFileSync(p,'utf8'));const m=new Map(s.steps.map(x=>[x.id,x]));for(const id of ['http','browser','database'])r.checks[id]={state:m.get(id)?.state??'MISSING',message:m.get(id)?.message??null};r.status=['http','browser','database'].every(id=>m.get(id)?.state==='PASS')?'PASS':'FAIL';r.testBatteryState=s.state;}else r.error=`TEST_BATTERY_STATUS_MISSING:${p||'no-path'}`;
          fs.writeFileSync('qualification/results/runtime-browser-database.json',JSON.stringify(r,null,2)+'\n');console.log(JSON.stringify(r,null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/runtime-browser-database.json qualification/results/runtime-startup-v3.json
          if ! git diff --cached --quiet; then git commit -m 'ci: publish RC18 runtime browser database evidence v3 [skip ci]'; git push origin HEAD:automation-platform-rc18-qualification; fi

      - name: Require HTTP browser and database PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');const e=JSON.parse(fs.readFileSync('qualification/results/runtime-browser-database.json','utf8'));console.log(JSON.stringify(e,null,2));for(const id of ['http','browser','database'])if(e.checks?.[id]?.state!=='PASS')throw new Error(`${id}:${e.checks?.[id]?.state||'MISSING'}`);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-runtime-browser-database-v3
          path: |
            qualification/results/runtime-browser-database.json
            qualification/results/runtime-startup-v3.json
            ${{ steps.battery.outputs.output_root }}/${{ steps.battery.outputs.run_id }}/
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/worker-automation.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-runtime-db >/dev/null 2>&1 || true
