name: RC18 Runtime Browser Database Qualification V2

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-runtime-browser-database-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    name: Exact RC18 runtime + browser + database drills v2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct and apply exact RC18 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in
            0) ;;
            2) encoded="${encoded}==" ;;
            3) encoded="${encoded}=" ;;
            *) echo "invalid base64 length ${#encoded}"; exit 91 ;;
          esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -t "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18-core.patch.gz" > "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary "$RUNNER_TEMP/rc18-core.patch"
          test -f scripts/test-battery-runner.mjs
          test -f scripts/browser-release-check.mjs
          test -f scripts/automation-closure-stage-tracker-check.mjs
          grep -q 'runtime:closure-tracker:check' package.json
          echo "RC18 patch applied: $(git diff --name-only | wc -l | tr -d ' ') files"

      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile

      - name: Start primary PostgreSQL 17 and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-runtime-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for attempt in $(seq 1 60); do
            docker exec rc18-runtime-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rc18-runtime-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-runtime-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          echo "latest_migration=$latest"
          test "$latest" = '078_transactional_local_upgrade.sql'

      - name: Build RC18
        run: pnpm build

      - name: Start worker and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-actions-runtime-proof' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker-automation.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"

      - name: Wait until web and automation worker are healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            live="$(curl -sS -o /tmp/live.json -w '%{http_code}' "$APP_ORIGIN/api/health/live" || true)"
            ready="$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$APP_ORIGIN/api/health/ready" || true)"
            worker="$(curl -sS -o /tmp/worker.json -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status" || true)"
            status="$(node -e "try{const j=require('/tmp/worker.json');process.stdout.write(String(j.status||''))}catch{}")"
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$worker" = 200 ] && [ "$status" = healthy ]; then
              cat /tmp/ready.json
              cat /tmp/worker.json
              exit 0
            fi
            sleep 1
          done
          echo '--- ready ---'; cat /tmp/ready.json || true
          echo '--- worker ---'; cat /tmp/worker.json || true
          echo '--- web log ---'; tail -200 "$RUNNER_TEMP/web.log" || true
          echo '--- worker log ---'; tail -200 "$RUNNER_TEMP/worker-automation.log" || true
          exit 1

      - name: Run official RC18 Test Center
        id: battery
        shell: bash
        run: |
          set +e
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/rc18-test-runs"
          mkdir -p "$OUT"
          export BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "browser=$BROWSER_EXECUTABLE"
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          echo "runner_exit=$?" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "output_root=$OUT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require HTTP, browser and database PASS
        shell: bash
        env:
          RUN_ID: ${{ steps.battery.outputs.run_id }}
          OUT: ${{ steps.battery.outputs.output_root }}
        run: |
          set -euo pipefail
          node - "$OUT/$RUN_ID/status.json" <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const m=new Map(s.steps.map(x=>[x.id,x]));
          const ids=['http','browser','database'];
          const checks=Object.fromEntries(ids.map(id=>[id,{state:m.get(id)?.state,message:m.get(id)?.message}]));
          console.log(JSON.stringify({runId:s.runId,batteryState:s.state,checks},null,2));
          for(const id of ids) if(m.get(id)?.state!=='PASS') throw new Error(`${id}:${m.get(id)?.state||'MISSING'}`);
          NODE

      - name: Publish runtime/browser/database evidence
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.battery.outputs.run_id }}
          OUT: ${{ steps.battery.outputs.output_root }}
        run: |
          set -euo pipefail
          mkdir -p qualification/results
          node - "$OUT" "$RUN_ID" <<'NODE'
          const fs=require('fs');const [out,runId]=process.argv.slice(2);
          const result={schemaVersion:2,stage:'runtime-browser-database',status:'FAIL',runId:runId||null,generatedAt:new Date().toISOString(),checks:{}};
          try{const s=JSON.parse(fs.readFileSync(`${out}/${runId}/status.json`,'utf8'));const m=new Map(s.steps.map(x=>[x.id,x]));for(const id of ['http','browser','database'])result.checks[id]={state:m.get(id)?.state??'MISSING',message:m.get(id)?.message??null};result.status=['http','browser','database'].every(id=>m.get(id)?.state==='PASS')?'PASS':'FAIL';result.testBatteryState=s.state;}catch(e){result.error=e.message||String(e)}
          fs.writeFileSync('qualification/results/runtime-browser-database.json',JSON.stringify(result,null,2)+'\n');console.log(JSON.stringify(result,null,2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/runtime-browser-database.json
          if ! git diff --cached --quiet -- qualification/results/runtime-browser-database.json; then
            git commit -m 'ci: publish RC18 runtime browser database evidence v2 [skip ci]'
            git push origin HEAD:automation-platform-rc18-qualification
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-runtime-browser-database-v2
          path: |
            ${{ steps.battery.outputs.output_root }}/${{ steps.battery.outputs.run_id }}/
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/worker-automation.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-runtime-db >/dev/null 2>&1 || true
