name: Render Blueprint

on:
  push:
    branches:
      - main
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse render.yaml
        shell: ruby {0}
        run: |
          require "yaml"
          data = YAML.safe_load_file("render.yaml", aliases: true)
          abort "render.yaml must define exactly 3 services" unless data.is_a?(Hash) && data["services"].is_a?(Array) && data["services"].size == 3

          services = data["services"]
          names = services.map { |service| service["name"] }
          expected = ["automation-web", "automation-worker-ingress", "automation-worker-outbound"]
          abort "unexpected Render service set: #{names.inspect}" unless names.sort == expected.sort

          services.each do |service|
            plan = service["plan"]
            type = service["type"]

            if plan == "free" && service.key?("preDeployCommand")
              abort "#{service["name"]}: free services cannot use preDeployCommand"
            end

            if type == "worker" && plan == "free"
              abort "#{service["name"]}: background workers do not support the free plan"
            end

            abort "#{service["name"]}: autoDeployTrigger must be checksPass" unless service["autoDeployTrigger"] == "checksPass"
          end

          ingress = services.find { |service| service["name"] == "automation-worker-ingress" }
          abort "ingress worker must own the migration pre-deploy step" unless ingress && ingress["preDeployCommand"] == "pnpm --filter @automation/storage-postgres migrate"
