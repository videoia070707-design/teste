name: Render Blueprint

on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/render-blueprint.yml

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse render.yaml
        run: ruby -e "require 'yaml'; data = YAML.safe_load_file('render.yaml', aliases: true); abort('services missing') unless data.is_a?(Hash) && data['services'].is_a?(Array) && data['services'].size == 3"
