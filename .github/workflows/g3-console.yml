name: G3 Console

on:
  push:
    branches: [main]
    paths:
      - 'tools/g3-console/**'
      - 'scripts/g3-console-server.mjs'
      - 'package.json'
      - '.github/workflows/g3-console.yml'
  pull_request:
    paths:
      - 'tools/g3-console/**'
      - 'scripts/g3-console-server.mjs'
      - 'package.json'
      - '.github/workflows/g3-console.yml'

permissions:
  contents: read

jobs:
  rc18_toolchain:
    name: RC18 Stage 1 - toolchain typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact RC18
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          rem=$((${#encoded}%4))
          [ "$rem" -ne 2 ] || encoded="${encoded}=="
          [ "$rem" -ne 3 ] || encoded="${encoded}="
          [ "$rem" -ne 1 ]
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -t "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
          test -f scripts/automation-closure-stage-tracker-check.mjs
      - name: Install and qualify exact RC18
        shell: bash
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  rc18_powershell:
    name: RC18 Stage 2 - Windows PowerShell parser
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact RC18
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          rem=$((${#encoded}%4))
          [ "$rem" -ne 2 ] || encoded="${encoded}=="
          [ "$rem" -ne 3 ] || encoded="${encoded}="
          [ "$rem" -ne 1 ]
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
      - name: Parse all RC18 PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem scripts/windows -Filter *.ps1 -File | Sort-Object Name)
          if($files.Count -ne 15){throw "Expected 15 PowerShell files, got $($files.Count)"}
          $errors=@()
          foreach($file in $files){
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach($e in $parseErrors){$errors += "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"}
          }
          if($errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_ }; exit 1}
          Write-Host "PASS: $($files.Count)/15 PowerShell files"

  rc18_runtime_browser_database:
    name: RC18 Stage 3+4 - runtime browser and Docker database drills
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact RC18 and install
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          rem=$((${#encoded}%4))
          [ "$rem" -ne 2 ] || encoded="${encoded}=="
          [ "$rem" -ne 3 ] || encoded="${encoded}="
          [ "$rem" -ne 1 ]
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Start PostgreSQL and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-qualification-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 90); do docker exec rc18-qualification-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break; sleep 1; done
          docker exec rc18-qualification-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-qualification-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          echo "latest=$latest"
          test "$latest" = '078_transactional_local_upgrade.sql'
      - name: Start web and automation worker
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-rc18-direct' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker.log" 2>&1 & echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 & echo $! > "$RUNNER_TEMP/web.pid"
          ok=0
          for i in $(seq 1 120); do
            live=$(curl -sS -o /tmp/live -w '%{http_code}' "$APP_ORIGIN/api/health/live" 2>/dev/null || true)
            ready=$(curl -sS -o /tmp/ready -w '%{http_code}' "$APP_ORIGIN/api/health/ready" 2>/dev/null || true)
            boot=$(curl -sS -o /tmp/boot -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" 2>/dev/null || true)
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$boot" = 200 ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then cat /tmp/live || true; cat /tmp/ready || true; cat /tmp/boot || true; tail -200 "$RUNNER_TEMP/web.log" || true; tail -200 "$RUNNER_TEMP/worker.log" || true; exit 1; fi
      - name: Browser hydration proof
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          node scripts/browser-release-check.mjs --origin "$APP_ORIGIN" --browser "$BROWSER" --output "$RUNNER_TEMP/browser.json"
          cat "$RUNNER_TEMP/browser.json"
      - name: Run full Test Center and require database drill PASS
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/runs"
          mkdir -p "$OUT"
          export BROWSER_EXECUTABLE="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          set +e
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          runner=$?
          set -e
          node - "$OUT/$RUN_ID/status.json" <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const m=new Map(s.steps.map(x=>[x.id,x]));
          for(const id of ['http','browser','database']){
            const st=m.get(id)?.state||'MISSING';
            console.log(`${id}=${st}: ${m.get(id)?.message||''}`);
            if(st!=='PASS') throw new Error(`${id}:${st}`);
          }
          NODE
          echo "runner_exit=$runner"
      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- web ---'; tail -250 "$RUNNER_TEMP/web.log" || true
          echo '--- worker ---'; tail -250 "$RUNNER_TEMP/worker.log" || true
          docker logs --tail 250 rc18-qualification-db || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-qualification-db >/dev/null 2>&1 || true
