name: G3 Console

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/g3-console.yml'
  pull_request:
    paths:
      - '.github/workflows/g3-console.yml'

permissions:
  contents: read

jobs:
  rc18_transport_diagnostic:
    name: RC18 transport diagnostic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose all RC18 transport chunks
        shell: bash
        run: |
          set -u
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          echo "parts=${#parts[@]}"
          test "${#parts[@]}" -eq 12 || exit 1
          rm -f "$RUNNER_TEMP/rc18.gz"
          : > "$RUNNER_TEMP/rc18.gz"
          bad=0
          for part in "${parts[@]}"; do
            clean="$RUNNER_TEMP/$(basename "$part").clean"
            tr -d '\r\n\t ' < "$part" > "$clean"
            len=$(wc -c < "$clean" | tr -d ' ')
            rem=$((len%4))
            invalid=$(LC_ALL=C grep -o '[^A-Za-z0-9+/=]' "$clean" | head -20 | od -An -tx1 | tr -d ' \n' || true)
            echo "chunk=$part raw=$(wc -c < "$part" | tr -d ' ') clean=$len mod4=$rem invalid_hex=${invalid:-none}"
            if ! base64 --decode "$clean" > "$RUNNER_TEMP/chunk.bin" 2>"$RUNNER_TEMP/chunk.err"; then
              echo "DECODE_FAIL=$part"
              cat "$RUNNER_TEMP/chunk.err"
              bad=1
              continue
            fi
            echo "decoded=$(wc -c < "$RUNNER_TEMP/chunk.bin" | tr -d ' ') sha256=$(sha256sum "$RUNNER_TEMP/chunk.bin" | awk '{print $1}')"
            cat "$RUNNER_TEMP/chunk.bin" >> "$RUNNER_TEMP/rc18.gz"
          done
          echo "combined_bytes=$(wc -c < "$RUNNER_TEMP/rc18.gz" | tr -d ' ') combined_sha256=$(sha256sum "$RUNNER_TEMP/rc18.gz" | awk '{print $1}')"
          if [ "$bad" -ne 0 ]; then exit 2; fi
          gzip -tv "$RUNNER_TEMP/rc18.gz"
