name: RC18 Stage 3+4 Final Proof

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-stage34-final-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage34:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-platform-rc18-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct exact RC18 correctly
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          : > "$RUNNER_TEMP/rc18.gz"
          for part in "${parts[@]}"; do
            encoded="$(tr -d '\r\n\t ' < "$part")"
            rem=$((${#encoded}%4))
            [ "$rem" -ne 2 ] || encoded="${encoded}=="
            [ "$rem" -ne 3 ] || encoded="${encoded}="
            [ "$rem" -ne 1 ]
            printf '%s' "$encoded" | base64 --decode >> "$RUNNER_TEMP/rc18.gz"
          done
          gzip -t "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          test -s "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
          test -f scripts/automation-closure-stage-tracker-check.mjs
          test -f scripts/test-battery-runner.mjs
          test -f scripts/browser-release-check.mjs
          test -f apps/worker-automation/package.json

      - name: Install exact toolchain and build
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@9.15.4
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Start PostgreSQL 17 and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-stage34-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 90); do
            docker exec rc18-stage34-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rc18-stage34-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-stage34-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          echo "latest=$latest"
          test "$latest" = '078_transactional_local_upgrade.sql'

      - name: Start web and automation worker
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-rc18-stage34' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker.log" 2>&1 & echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 & echo $! > "$RUNNER_TEMP/web.pid"
          ok=0
          for i in $(seq 1 120); do
            live=$(curl -sS -o /tmp/live -w '%{http_code}' "$APP_ORIGIN/api/health/live" 2>/dev/null || true)
            ready=$(curl -sS -o /tmp/ready -w '%{http_code}' "$APP_ORIGIN/api/health/ready" 2>/dev/null || true)
            boot=$(curl -sS -o /tmp/boot -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" 2>/dev/null || true)
            hb=$(docker exec rc18-stage34-db psql -U postgres -d automation_runtime -Atqc "select coalesce((select runtime_state||'|'||(last_seen_at>=now()-interval '30 seconds')::text from app_private.worker_heartbeats where worker_kind='worker-automation' and worker_id='github-rc18-stage34' order by last_seen_at desc limit 1),'missing');" 2>/dev/null || true)
            echo "attempt=$i live=$live ready=$ready boot=$boot hb=$hb"
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$boot" = 200 ] && [[ "$hb" == active\|true ]]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            cat /tmp/live || true; cat /tmp/ready || true; cat /tmp/boot || true
            tail -250 "$RUNNER_TEMP/web.log" || true
            tail -250 "$RUNNER_TEMP/worker.log" || true
            exit 1
          fi

      - name: Browser hydration proof
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          node scripts/browser-release-check.mjs --origin "$APP_ORIGIN" --browser "$BROWSER" --output "$RUNNER_TEMP/browser.json"
          cat "$RUNNER_TEMP/browser.json"

      - name: Run official Test Center and collect evidence
        shell: bash
        run: |
          set +e
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/runs"
          mkdir -p "$OUT" qualification/results
          export BROWSER_EXECUTABLE="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          runner=$?
          STATUS="$OUT/$RUN_ID/status.json"
          if [ ! -f "$STATUS" ]; then echo "missing status: $STATUS"; exit 92; fi
          STATUS_FILE="$STATUS" RUN_ID_VALUE="$RUN_ID" RUNNER_EXIT="$runner" node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.env.STATUS_FILE,'utf8'));const m=new Map((s.steps||[]).map(x=>[x.id,x]));const p=id=>({state:m.get(id)?.state??'MISSING',message:m.get(id)?.message??null});const http=p('http'),browser=p('browser'),database=p('database');const runtimeStatus=http.state==='PASS'&&browser.state==='PASS'?'PASS':'FAIL';const databaseStatus=database.state==='PASS'?'PASS':'FAIL';const base={schemaVersion:8,exactRc18:true,runId:process.env.RUN_ID_VALUE,runnerExit:Number(process.env.RUNNER_EXIT),testBatteryState:s.state,generatedAt:new Date().toISOString()};fs.writeFileSync('qualification/results/rc18-stage3-runtime-browser.json',JSON.stringify({...base,stage:3,status:runtimeStatus,checks:{http,browser}},null,2)+'\\n');fs.writeFileSync('qualification/results/rc18-stage4-database-drills.json',JSON.stringify({...base,stage:4,status:databaseStatus,checks:{database}},null,2)+'\\n');console.log(JSON.stringify({runtimeStatus,databaseStatus,http,browser,database},null,2));"
          exit 0

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f qualification/results/rc18-stage3-runtime-browser.json
          test -f qualification/results/rc18-stage4-database-drills.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/rc18-stage3-runtime-browser.json qualification/results/rc18-stage4-database-drills.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish RC18 stage 3+4 evidence [skip ci]'
            git pull --rebase origin automation-platform-rc18-qualification
            git push origin HEAD:automation-platform-rc18-qualification
          fi

      - name: Require stage 3 and 4 PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');let fail=false;for(const f of ['qualification/results/rc18-stage3-runtime-browser.json','qualification/results/rc18-stage4-database-drills.json']){const x=JSON.parse(fs.readFileSync(f,'utf8'));console.log(JSON.stringify(x,null,2));if(x.status!=='PASS')fail=true;}if(fail)process.exit(1);"

      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- web ---'; tail -300 "$RUNNER_TEMP/web.log" || true
          echo '--- worker ---'; tail -300 "$RUNNER_TEMP/worker.log" || true
          docker logs --tail 300 rc18-stage34-db || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-stage34-db >/dev/null 2>&1 || true
