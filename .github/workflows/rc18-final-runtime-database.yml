name: RC18 Final Runtime Browser Database Proof

on:
  push:
    branches:
      - automation-platform-rc18-final-qualification
    paths:
      - '.github/workflows/rc18-final-runtime-database.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-platform-rc18-final-qualification

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct exact RC18 source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in
            0) ;;
            2) encoded="${encoded}==" ;;
            3) encoded="${encoded}=" ;;
            *) echo "invalid base64 remainder=$remainder"; exit 91 ;;
          esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18.patch.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
          test -f scripts/test-battery-runner.mjs
          test -f apps/worker-automation/package.json

      - name: Install exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile

      - name: Start PostgreSQL 17 and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-final-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for attempt in $(seq 1 60); do
            docker exec rc18-final-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec rc18-final-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-final-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          echo "latest=$latest"
          test "$latest" = '078_transactional_local_upgrade.sql'

      - name: Build exact RC18
        shell: bash
        run: pnpm build

      - name: Start automation worker and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='gha-rc18-final' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"

      - name: Wait for healthy runtime
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 120); do
            live=$(curl -sS -o /tmp/live.json -w '%{http_code}' "$APP_ORIGIN/api/health/live" 2>/dev/null || true)
            ready=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$APP_ORIGIN/api/health/ready" 2>/dev/null || true)
            boot=$(curl -sS -o /tmp/boot.json -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" 2>/dev/null || true)
            hb=$(docker exec rc18-final-db psql -U postgres -d automation_runtime -Atqc "select coalesce((select runtime_state||'|'||(last_seen_at>=now()-interval '30 seconds')::text from app_private.worker_heartbeats where worker_kind='worker-automation' and worker_id='gha-rc18-final' order by last_seen_at desc limit 1),'missing');" 2>/dev/null || true)
            echo "attempt=$attempt live=$live ready=$ready boot=$boot hb=$hb"
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$boot" = 200 ] && [[ "$hb" == active\|true ]]; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo '--- web.log ---'; tail -200 "$RUNNER_TEMP/web.log" || true
            echo '--- worker.log ---'; tail -200 "$RUNNER_TEMP/worker.log" || true
            echo '--- live ---'; cat /tmp/live.json || true
            echo '--- ready ---'; cat /tmp/ready.json || true
            echo '--- boot ---'; cat /tmp/boot.json || true
            exit 1
          fi

      - name: Run official RC18 Test Center battery
        shell: bash
        run: |
          set +e
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/rc18-runs"
          mkdir -p "$OUT" qualification/results
          export BROWSER_EXECUTABLE="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "browser=$BROWSER_EXECUTABLE"
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          runner_exit=$?
          STATUS="$OUT/$RUN_ID/status.json"
          if [ ! -f "$STATUS" ]; then
            echo "status missing: $STATUS"
            find "$OUT" -maxdepth 4 -type f -print || true
            exit 92
          fi
          STATUS_FILE="$STATUS" RUN_ID_VALUE="$RUN_ID" RUNNER_EXIT="$runner_exit" node -e "const fs=require('fs');const status=JSON.parse(fs.readFileSync(process.env.STATUS_FILE,'utf8'));const steps=new Map((status.steps||[]).map(s=>[s.id,s]));const pick=id=>({state:steps.get(id)?.state??'MISSING',message:steps.get(id)?.message??null});const http=pick('http'),browser=pick('browser'),database=pick('database');const runtimeStatus=http.state==='PASS'&&browser.state==='PASS'?'PASS':'FAIL';const databaseStatus=database.state==='PASS'?'PASS':'FAIL';const base={schemaVersion:5,exactRc18:true,sourceBranch:'automation-platform-rc18-final-qualification',runId:process.env.RUN_ID_VALUE,runnerExit:Number(process.env.RUNNER_EXIT),testBatteryState:status.state,generatedAt:new Date().toISOString()};fs.writeFileSync('qualification/results/rc18-final-runtime-browser.json',JSON.stringify({...base,stage:'local-runtime-browser',status:runtimeStatus,checks:{http,browser}},null,2)+'\\n');fs.writeFileSync('qualification/results/rc18-final-database-drills.json',JSON.stringify({...base,stage:'database-docker-drills',status:databaseStatus,checks:{database}},null,2)+'\\n');console.log(JSON.stringify({runtimeStatus,databaseStatus,http,browser,database},null,2));"
          exit 0

      - name: Publish RC18 final qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f qualification/results/rc18-final-runtime-browser.json
          test -f qualification/results/rc18-final-database-drills.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/rc18-final-runtime-browser.json qualification/results/rc18-final-database-drills.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: publish RC18 final runtime/database evidence [skip ci]'
            git pull --rebase origin automation-platform-rc18-final-qualification
            git push origin HEAD:automation-platform-rc18-final-qualification
          fi

      - name: Require stage 3 and 4 PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');let failed=false;for(const file of ['qualification/results/rc18-final-runtime-browser.json','qualification/results/rc18-final-database-drills.json']){const value=JSON.parse(fs.readFileSync(file,'utf8'));console.log(JSON.stringify(value,null,2));if(value.status!=='PASS')failed=true;}if(failed)process.exit(1);"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-final-db >/dev/null 2>&1 || true
