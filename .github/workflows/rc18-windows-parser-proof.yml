name: RC18 Windows Exact Parser Proof

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-windows-parser-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  powershell-parser:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-platform-rc18-qualification

      - name: Reconstruct exact RC18
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in 0) ;; 2) encoded="${encoded}==" ;; 3) encoded="${encoded}=" ;; *) exit 91 ;; esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18.patch.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql

      - name: Parse exact RC18 PowerShell scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qualification/results | Out-Null
          $files=@(Get-ChildItem -Path scripts/windows -Filter *.ps1 -File | Sort-Object Name)
          $errors=@()
          foreach($file in $files){
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach($e in $parseErrors){$errors += [pscustomobject]@{file=$file.Name;message=$e.Message;line=$e.Extent.StartLineNumber;column=$e.Extent.StartColumnNumber}}
          }
          $status=if($files.Count -eq 15 -and $errors.Count -eq 0){'PASS'}else{'FAIL'}
          $evidence=[ordered]@{schemaVersion=3;stage='windows-powershell';status=$status;exactRc18=$true;parsedFiles=$files.Count;expectedFiles=15;sourceCommit='${{ github.sha }}';runner='Windows';generatedAt=(Get-Date).ToUniversalTime().ToString('o');errors=$errors}
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 qualification/results/windows-powershell.json
          $evidence | ConvertTo-Json -Depth 8
          if($status -ne 'PASS'){exit 1}

      - name: Publish parser evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path qualification/results/windows-powershell.json)){throw 'Evidence missing'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/windows-powershell.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'ci: publish exact RC18 Windows parser evidence [skip ci]'; git pull --rebase origin automation-platform-rc18-qualification; git push origin HEAD:automation-platform-rc18-qualification}
