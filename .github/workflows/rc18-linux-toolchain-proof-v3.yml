name: RC18 Linux Toolchain Proof V3

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-linux-toolchain-proof-v3.yml'
      - '.ci/rc18-core.patch.b64.*'

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Qualify RC18 toolchain from exact compressed patch
        shell: bash
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          mkdir -p qualification/results
          for f in patch corepack-enable corepack-prepare pnpm-version pnpm-install pnpm-typecheck pnpm-test pnpm-build; do : > "/tmp/$f.log"; done

          patch_exit=0
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          if [ "${#parts[@]}" -ne 12 ]; then
            echo "Expected 12 RC18 patch chunks, found ${#parts[@]}" > /tmp/patch.log
            patch_exit=91
          else
            cat "${parts[@]}" | tr -d '\r\n\t ' | base64 --decode --ignore-garbage > /tmp/rc18-core.patch.gz 2>>/tmp/patch.log
            decode_exit=$?
            echo "BASE64_EXIT=$decode_exit BYTES=$(wc -c </tmp/rc18-core.patch.gz)" >> /tmp/patch.log
            gzip -t /tmp/rc18-core.patch.gz >>/tmp/patch.log 2>&1
            gzip_exit=$?
            echo "GZIP_TEST_EXIT=$gzip_exit" >> /tmp/patch.log
            if [ "$gzip_exit" -ne 0 ]; then
              patch_exit=93
            else
              gzip -dc /tmp/rc18-core.patch.gz > /tmp/rc18-core.patch 2>>/tmp/patch.log
              patch_exit=$?
            fi
            if [ "$patch_exit" -eq 0 ]; then
              git apply --binary --check /tmp/rc18-core.patch >>/tmp/patch.log 2>&1
              patch_exit=$?
            fi
            if [ "$patch_exit" -eq 0 ]; then
              git apply --binary /tmp/rc18-core.patch >>/tmp/patch.log 2>&1
              patch_exit=$?
            fi
          fi

          if [ "$patch_exit" -eq 0 ]; then
            changed="$(git diff --name-only | wc -l | tr -d ' ')"
            echo "RC18_PATCH_APPLIED files=$changed" >> /tmp/patch.log
            if [ "$changed" -lt 1 ]; then patch_exit=92; fi
          fi

          if [ "$patch_exit" -eq 0 ]; then corepack enable > /tmp/corepack-enable.log 2>&1; corepack_enable=$?; else corepack_enable=99; fi
          if [ "$corepack_enable" -eq 0 ]; then corepack prepare pnpm@9.15.4 --activate > /tmp/corepack-prepare.log 2>&1; corepack_prepare=$?; else corepack_prepare=99; fi
          if [ "$corepack_prepare" -eq 0 ]; then pnpm --version > /tmp/pnpm-version.log 2>&1; pnpm_version_exit=$?; else pnpm_version_exit=99; fi
          if [ "$pnpm_version_exit" -eq 0 ]; then pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1; install_exit=$?; else install_exit=99; fi
          if [ "$install_exit" -eq 0 ]; then
            pnpm typecheck > /tmp/pnpm-typecheck.log 2>&1; typecheck_exit=$?
            pnpm test > /tmp/pnpm-test.log 2>&1; test_exit=$?
            pnpm build > /tmp/pnpm-build.log 2>&1; build_exit=$?
          else typecheck_exit=99; test_exit=99; build_exit=99; fi

          export PATCH_EXIT="$patch_exit" COREPACK_ENABLE="$corepack_enable" COREPACK_PREPARE="$corepack_prepare" PNPM_VERSION_EXIT="$pnpm_version_exit" INSTALL_EXIT="$install_exit" TYPECHECK_EXIT="$typecheck_exit" TEST_EXIT="$test_exit" BUILD_EXIT="$build_exit" SOURCE_COMMIT='${{ github.sha }}'
          node <<'NODE'
          const fs=require('fs');const n=k=>Number(process.env[k]||99);const tail=(f,m=6000)=>{try{const s=fs.readFileSync(f,'utf8');return s.length>m?s.slice(-m):s}catch{return ''}};
          const checks={patch:n('PATCH_EXIT'),corepackEnable:n('COREPACK_ENABLE'),corepackPrepare:n('COREPACK_PREPARE'),pnpmVersion:n('PNPM_VERSION_EXIT'),install:n('INSTALL_EXIT'),typecheck:n('TYPECHECK_EXIT'),test:n('TEST_EXIT'),build:n('BUILD_EXIT')};
          const status=Object.values(checks).every(v=>v===0)?'PASS':'FAIL';
          const evidence={schemaVersion:4,stage:'toolchain-dependencies',status,node:process.version,sourceCommit:process.env.SOURCE_COMMIT,runner:'Linux',generatedAt:new Date().toISOString(),checks,tails:{patch:tail('/tmp/patch.log'),corepackEnable:tail('/tmp/corepack-enable.log',1500),corepackPrepare:tail('/tmp/corepack-prepare.log',1500),pnpmVersion:tail('/tmp/pnpm-version.log',1000),install:tail('/tmp/pnpm-install.log'),typecheck:tail('/tmp/pnpm-typecheck.log'),test:tail('/tmp/pnpm-test.log'),build:tail('/tmp/pnpm-build.log')}};
          fs.writeFileSync('qualification/results/linux-toolchain.json',JSON.stringify(evidence,null,2)+'\n');console.log(JSON.stringify(evidence,null,2));if(status!=='PASS')process.exitCode=1;
          NODE

      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f qualification/results/linux-toolchain.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/linux-toolchain.json
          if ! git diff --cached --quiet -- qualification/results/linux-toolchain.json; then
            git commit -m 'ci: publish RC18 Linux toolchain evidence v3 [skip ci]'
            git push origin HEAD:automation-platform-rc18-qualification
          fi
