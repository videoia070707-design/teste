name: RC18 Linux Toolchain Proof

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-linux-toolchain-proof.yml'
      - '.ci/rc18-core.patch.b64.*'

permissions:
  contents: write

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Reconstruct and apply exact RC18 source patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          if [ "${#parts[@]}" -ne 12 ]; then
            echo "Expected 12 RC18 patch chunks, found ${#parts[@]}" >&2
            exit 1
          fi
          cat "${parts[@]}" | base64 -d > /tmp/rc18-core.patch
          test -s /tmp/rc18-core.patch
          git apply --binary --check /tmp/rc18-core.patch
          git apply --binary /tmp/rc18-core.patch
          changed="$(git diff --name-only | wc -l | tr -d ' ')"
          if [ "$changed" -lt 1 ]; then
            echo 'RC18 patch produced no source changes.' >&2
            exit 1
          fi
          echo "RC18_PATCH_APPLIED files=$changed"

      - name: Run exact toolchain qualification
        id: qualify
        shell: bash
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          mkdir -p qualification/results

          corepack enable > /tmp/corepack-enable.log 2>&1
          corepack_enable=$?
          if [ "$corepack_enable" -eq 0 ]; then
            corepack prepare pnpm@9.15.4 --activate > /tmp/corepack-prepare.log 2>&1
            corepack_prepare=$?
          else
            corepack_prepare=99
          fi

          if [ "$corepack_prepare" -eq 0 ]; then
            pnpm --version > /tmp/pnpm-version.log 2>&1
            pnpm_version_exit=$?
          else
            pnpm_version_exit=99
          fi

          if [ "$pnpm_version_exit" -eq 0 ]; then
            pnpm install --frozen-lockfile > /tmp/pnpm-install.log 2>&1
            install_exit=$?
          else
            install_exit=99
          fi

          if [ "$install_exit" -eq 0 ]; then
            pnpm typecheck > /tmp/pnpm-typecheck.log 2>&1
            typecheck_exit=$?
            pnpm test > /tmp/pnpm-test.log 2>&1
            test_exit=$?
            pnpm build > /tmp/pnpm-build.log 2>&1
            build_exit=$?
          else
            typecheck_exit=99
            test_exit=99
            build_exit=99
          fi

          export COREPACK_ENABLE="$corepack_enable"
          export COREPACK_PREPARE="$corepack_prepare"
          export PNPM_VERSION_EXIT="$pnpm_version_exit"
          export INSTALL_EXIT="$install_exit"
          export TYPECHECK_EXIT="$typecheck_exit"
          export TEST_EXIT="$test_exit"
          export BUILD_EXIT="$build_exit"
          export SOURCE_COMMIT='${{ github.sha }}'

          node <<'NODE'
          const fs = require('fs');
          const readTail = (file, max = 5000) => {
            try {
              const text = fs.readFileSync(file, 'utf8');
              return text.length > max ? text.slice(-max) : text;
            } catch { return ''; }
          };
          const n = (name) => Number(process.env[name] || 99);
          const checks = {
            corepackEnable: n('COREPACK_ENABLE'),
            corepackPrepare: n('COREPACK_PREPARE'),
            pnpmVersion: n('PNPM_VERSION_EXIT'),
            install: n('INSTALL_EXIT'),
            typecheck: n('TYPECHECK_EXIT'),
            test: n('TEST_EXIT'),
            build: n('BUILD_EXIT'),
          };
          const status = Object.values(checks).every((value) => value === 0) ? 'PASS' : 'FAIL';
          const evidence = {
            schemaVersion: 1,
            stage: 'toolchain-dependencies',
            status,
            node: process.version,
            sourceCommit: process.env.SOURCE_COMMIT,
            runner: 'Linux',
            generatedAt: new Date().toISOString(),
            checks,
            tails: {
              corepackPrepare: readTail('/tmp/corepack-prepare.log', 1500),
              install: readTail('/tmp/pnpm-install.log'),
              typecheck: readTail('/tmp/pnpm-typecheck.log'),
              test: readTail('/tmp/pnpm-test.log'),
              build: readTail('/tmp/pnpm-build.log'),
            },
          };
          fs.writeFileSync('qualification/results/linux-toolchain.json', JSON.stringify(evidence, null, 2) + '\n');
          console.log(JSON.stringify(evidence, null, 2));
          if (status !== 'PASS') process.exitCode = 1;
          NODE

      - name: Publish toolchain evidence to qualification branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f qualification/results/linux-toolchain.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/linux-toolchain.json
          if ! git diff --cached --quiet -- qualification/results/linux-toolchain.json; then
            git commit -m 'ci: publish RC18 Linux toolchain evidence [skip ci]'
            git push origin HEAD:automation-platform-rc18-qualification
          else
            echo 'Evidence unchanged; nothing to commit.'
          fi
