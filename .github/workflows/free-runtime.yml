name: Free Runtime Adapter

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'supabase/**'
      - '.github/workflows/free-runtime.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'supabase/**'
      - '.github/workflows/free-runtime.yml'

jobs:
  validate-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate portable migration stream
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            001_core.sql
            002_provider_ingress.sql
            003_secret_envelopes.sql
            004_connection_health_and_identity.sql
            005_oauth_sessions.sql
            006_webhook_worker_leases.sql
            007_outbound_worker_leases.sql
            008_outbound_action_claims.sql
            009_oauth_actor_binding.sql
            010_provider_readiness_attestations.sql
            011_worker_heartbeats.sql
            012_foreign_key_indexes.sql
            021_meta_compliance.sql
            025_platform_public_config.sql
            026_oauth_consumption_membership_guard.sql
            027_setup_center_config_bridge.sql
            028_provider_runtime_config_portability.sql
            030_setup_center_patch_semantics.sql
          )
          mapfile -t actual < <(find database -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done

          if grep -RniE '\b(pgmq|pg_cron|pg_net)\b|vault\.' database; then
            echo 'Supabase-specific dependency leaked into portable database migrations.' >&2
            exit 1
          fi

      - name: Validate Supabase adapter migration stream
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            013_supabase_free_runtime.sql
            014_provider_keyring_vault.sql
            015_provider_runtime_config.sql
            016_generic_runtime_heartbeats.sql
            017_supabase_runtime_invocation.sql
            018_supabase_runtime_security_hardening.sql
            019_edge_runtime_heartbeat_identity.sql
            020_web_least_privilege_role.sql
            021_meta_compliance.sql
            022_meta_webhook_verify_token.sql
            023_instagram_platform_config.sql
            024_worker_heartbeats_primary_key.sql
            025_platform_public_config.sql
            026_oauth_consumption_membership_guard.sql
            027_setup_center_config_bridge.sql
            028_provider_runtime_config_portability.sql
            029_meta_app_secret_bridge.sql
            030_setup_center_patch_semantics.sql
          )
          mapfile -t actual < <(find supabase/migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do
            test "${actual[$i]}" = "${expected[$i]}"
          done

          for shared in 021_meta_compliance.sql 025_platform_public_config.sql 026_oauth_consumption_membership_guard.sql 027_setup_center_config_bridge.sql 028_provider_runtime_config_portability.sql 030_setup_center_patch_semantics.sql; do
            cmp --silent "database/$shared" "supabase/migrations/$shared" || {
              echo "Portable migration $shared drifted between database/ and supabase/migrations/." >&2
              exit 1
            }
          done

      - name: Validate G3 Edge outbound safety policy
        shell: ruby {0}
        run: |
          source = File.read("supabase/functions/g3-runtime/index.ts")

          required = {
            "max attempts" => "const OUTBOUND_MAX_ATTEMPTS = 5;",
            "lease duration" => "const OUTBOUND_LEASE_SECONDS = 45;",
            "retry schedule" => "const delays = [15, 60, 300, 1800];",
            "ambiguous success" => "AMBIGUOUS_PROVIDER_SUCCESS_WITHOUT_ID",
            "timeout after dispatch" => "PROVIDER_TIMEOUT_AFTER_DISPATCH",
            "transport closed after dispatch" => "PROVIDER_TRANSPORT_CLOSED_AFTER_DISPATCH",
            "ambiguous provider 5xx" => 'HTTP_${response.status}_AMBIGUOUS',
            "post-dispatch persistence guard" => "Deliberately preserve PROCESSING"
          }

          missing = required.reject { |_label, needle| source.include?(needle) }
          unless missing.empty?
            abort "G3 Edge outbound safety policy drifted: #{missing.keys.join(', ')}"
          end

          quarantine_start = source.index("async function quarantineExpiredOutbound")
          quarantine_end = source.index("async function processOutbound", quarantine_start || 0)
          abort "quarantineExpiredOutbound function not found" unless quarantine_start && quarantine_end
          quarantine = source[quarantine_start...quarantine_end]

          quarantine_required = {
            "PROCESSING source state" => "delivery_state = 'PROCESSING'",
            "unknown destination state" => "delivery_state = 'SEND_RESULT_UNKNOWN'",
            "reconciliation required" => "reconciliation_required = true",
            "lease-expiry evidence" => "EDGE_LEASE_EXPIRED_AFTER_DISPATCH_POSSIBLE"
          }
          missing_quarantine = quarantine_required.reject { |_label, needle| quarantine.include?(needle) }
          unless missing_quarantine.empty?
            abort "Expired outbound lease no longer fails safely: #{missing_quarantine.keys.join(', ')}"
          end

          puts "G3 Edge outbound ambiguity policy is locked: max=5, lease=45s, backoff=15/60/300/1800, no blind retry after ambiguous dispatch."

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.1.4

      - name: Typecheck Supabase Edge functions
        shell: bash
        run: |
          set -euo pipefail
          for function_dir in supabase/functions/*; do
            test -d "$function_dir" || continue
            test -f "$function_dir/index.ts" || continue
            test -f "$function_dir/deno.json"
            echo "Checking $function_dir"
            deno check --config "$function_dir/deno.json" "$function_dir/index.ts"
          done
