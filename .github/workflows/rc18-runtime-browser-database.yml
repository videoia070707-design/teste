name: RC18 Runtime Browser Database Qualification

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-runtime-browser-database.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify:
    name: Exact RC18 runtime + browser + database drills
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - name: Checkout qualification branch
        uses: actions/checkout@v4

      - name: Setup Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Apply exact RC18 core patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          cat "${parts[@]}" | tr -d '\r\n\t ' | base64 --decode --ignore-garbage > "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -t "$RUNNER_TEMP/rc18-core.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18-core.patch.gz" > "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18-core.patch"
          git apply --binary "$RUNNER_TEMP/rc18-core.patch"
          test -f scripts/test-battery-runner.mjs
          test -f scripts/browser-release-check.mjs
          test -f scripts/automation-closure-stage-tracker-check.mjs
          grep -q 'runtime:closure-tracker:check' package.json
          echo "RC18 exact patch applied: $(git diff --name-only | wc -l | tr -d ' ') changed files"

      - name: Prepare pnpm and dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile

      - name: Start primary PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-runtime-db \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=automation_runtime \
            -p 55432:5432 \
            postgres:17-alpine
          for attempt in $(seq 1 60); do
            if docker exec rc18-runtime-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs rc18-runtime-db
          exit 1

      - name: Apply RC18 portable migrations
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @automation/storage-postgres migrate
          count="$(docker exec rc18-runtime-db psql -U postgres -d automation_runtime -Atqc 'select count(*) from app_private.schema_migrations;')"
          latest="$(docker exec rc18-runtime-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"
          echo "migration_count=$count"
          echo "latest_migration=$latest"
          test "$latest" = '078_transactional_local_upgrade.sql'

      - name: Build exact RC18
        shell: bash
        run: |
          set -euo pipefail
          pnpm build

      - name: Start automation worker and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-actions-runtime-proof' \
            pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker-automation.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" \
            APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 \
            pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/web.pid"

      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            live_code="$(curl -sS -o /tmp/live.json -w '%{http_code}' http://127.0.0.1:3000/api/health/live || true)"
            ready_code="$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:3000/api/health/ready || true)"
            worker_code="$(curl -sS -o /tmp/worker.json -w '%{http_code}' http://127.0.0.1:3000/api/runtime/local-status || true)"
            worker_status="$(node -e "try{const j=require('/tmp/worker.json');process.stdout.write(String(j.status||''))}catch{}")"
            if [ "$live_code" = 200 ] && [ "$ready_code" = 200 ] && [ "$worker_code" = 200 ] && [ "$worker_status" = healthy ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo '--- live ---'; cat /tmp/live.json || true
            echo '--- ready ---'; cat /tmp/ready.json || true
            echo '--- worker ---'; cat /tmp/worker.json || true
            echo '--- web log ---'; tail -200 "$RUNNER_TEMP/web.log" || true
            echo '--- worker log ---'; tail -200 "$RUNNER_TEMP/worker-automation.log" || true
            exit 1
          fi
          cat /tmp/ready.json
          cat /tmp/worker.json

      - name: Run official RC18 Test Center battery
        id: battery
        shell: bash
        run: |
          set +e
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/rc18-test-runs"
          mkdir -p "$OUT"
          BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          export BROWSER_EXECUTABLE
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          runner_exit=$?
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "output_root=$OUT" >> "$GITHUB_OUTPUT"
          echo "runner_exit=$runner_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require runtime, browser and database PASS
        shell: bash
        env:
          RUN_ID: ${{ steps.battery.outputs.run_id }}
          OUT: ${{ steps.battery.outputs.output_root }}
        run: |
          set -euo pipefail
          STATUS="$OUT/$RUN_ID/status.json"
          test -f "$STATUS"
          node - "$STATUS" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const status = JSON.parse(fs.readFileSync(path, 'utf8'));
          const byId = new Map(status.steps.map(step => [step.id, step]));
          const required = ['http', 'browser', 'database'];
          const summary = Object.fromEntries(required.map(id => [id, { state: byId.get(id)?.state ?? 'MISSING', message: byId.get(id)?.message ?? null }]));
          console.log(JSON.stringify({ runId: status.runId, state: status.state, summary }, null, 2));
          for (const id of required) {
            if (byId.get(id)?.state !== 'PASS') throw new Error(`RC18_${id.toUpperCase()}_NOT_PASS:${byId.get(id)?.state ?? 'MISSING'}`);
          }
          NODE

      - name: Persist qualification result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ steps.battery.outputs.run_id }}
          OUT: ${{ steps.battery.outputs.output_root }}
        run: |
          set -euo pipefail
          mkdir -p qualification/results
          node - "$OUT" "$RUN_ID" <<'NODE'
          const fs = require('fs');
          const [out, runId] = process.argv.slice(2);
          let result = { schemaVersion: 1, stage: 'runtime-browser-database', status: 'FAIL', runId: runId || null, generatedAt: new Date().toISOString(), checks: {} };
          try {
            const status = JSON.parse(fs.readFileSync(`${out}/${runId}/status.json`, 'utf8'));
            const byId = new Map(status.steps.map(step => [step.id, step]));
            result.checks = Object.fromEntries(['http','browser','database'].map(id => [id, { state: byId.get(id)?.state ?? 'MISSING', message: byId.get(id)?.message ?? null }]));
            result.status = ['http','browser','database'].every(id => byId.get(id)?.state === 'PASS') ? 'PASS' : 'FAIL';
            result.testBatteryState = status.state;
          } catch (error) {
            result.error = error instanceof Error ? error.message : String(error);
          }
          fs.writeFileSync('qualification/results/runtime-browser-database.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/runtime-browser-database.json
          if ! git diff --cached --quiet -- qualification/results/runtime-browser-database.json; then
            git commit -m 'ci: publish RC18 runtime browser database evidence [skip ci]'
            git push origin HEAD:automation-platform-rc18-qualification
          fi

      - name: Upload Test Center evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc18-runtime-browser-database-evidence
          path: |
            ${{ steps.battery.outputs.output_root }}/${{ steps.battery.outputs.run_id }}/
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/worker-automation.log
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/web.pid" ]; then kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true; fi
          if [ -f "$RUNNER_TEMP/worker.pid" ]; then kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true; fi
          docker rm -f rc18-runtime-db >/dev/null 2>&1 || true
