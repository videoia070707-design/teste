name: RC18 Exact Stage 1 and 2 Qualification

on:
  push:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - '.github/workflows/rc18-exact-stage1-stage2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toolchain:
    name: Exact RC18 toolchain build test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-platform-rc18-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconstruct exact RC18
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in 0) ;; 2) encoded="${encoded}==" ;; 3) encoded="${encoded}=" ;; *) exit 91 ;; esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.patch.gz"
          gzip -t "$RUNNER_TEMP/rc18.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18.patch.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
          test -f scripts/automation-closure-stage-tracker-check.mjs
          test -f apps/worker-automation/package.json
      - name: Install exact toolchain and qualify
        id: qualify
        shell: bash
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          mkdir -p qualification/results
          corepack enable >/tmp/corepack-enable.log 2>&1; a=$?
          if [ $a -eq 0 ]; then corepack prepare pnpm@9.15.4 --activate >/tmp/corepack-prepare.log 2>&1; b=$?; else b=99; fi
          if [ $b -eq 0 ]; then pnpm --version >/tmp/pnpm-version.log 2>&1; c=$?; else c=99; fi
          if [ $c -eq 0 ]; then pnpm install --frozen-lockfile >/tmp/install.log 2>&1; d=$?; else d=99; fi
          if [ $d -eq 0 ]; then pnpm typecheck >/tmp/typecheck.log 2>&1; e=$?; pnpm test >/tmp/test.log 2>&1; f=$?; pnpm build >/tmp/build.log 2>&1; g=$?; else e=99; f=99; g=99; fi
          A=$a B=$b C=$c D=$d E=$e F=$f G=$g SOURCE='${{ github.sha }}' node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const n=k=>Number(process.env[k]||99), tail=p=>{try{const s=fs.readFileSync(p,'utf8');return s.slice(-10000)}catch{return ''}};
          const checks={corepackEnable:n('A'),corepackPrepare:n('B'),pnpmVersion:n('C'),install:n('D'),typecheck:n('E'),test:n('F'),build:n('G')};
          const migration=fs.readFileSync('database/078_transactional_local_upgrade.sql');
          const status=Object.values(checks).every(v=>v===0)?'PASS':'FAIL';
          const out={schemaVersion:1,stage:'toolchain-dependencies',status,exactRc18:true,node:process.version,pnpm:'9.15.4',sourceCommit:process.env.SOURCE,migration078Sha256:crypto.createHash('sha256').update(migration).digest('hex'),checks,generatedAt:new Date().toISOString(),tails:{install:tail('/tmp/install.log'),typecheck:tail('/tmp/typecheck.log'),test:tail('/tmp/test.log'),build:tail('/tmp/build.log')}};
          fs.writeFileSync('qualification/results/rc18-exact-toolchain.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          if(status!=='PASS') process.exitCode=1;
          NODE
      - name: Publish toolchain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f qualification/results/rc18-exact-toolchain.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/rc18-exact-toolchain.json
          if ! git diff --cached --quiet; then git commit -m 'ci: publish exact RC18 toolchain evidence [skip ci]'; git push origin HEAD:automation-platform-rc18-qualification; fi

  powershell:
    name: Exact RC18 PowerShell parser
    needs: toolchain
    if: always()
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation-platform-rc18-qualification
      - name: Reconstruct exact RC18
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          remainder=$((${#encoded} % 4))
          case "$remainder" in 0) ;; 2) encoded="${encoded}==" ;; 3) encoded="${encoded}=" ;; *) exit 91 ;; esac
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.patch.gz"
          gzip -dc "$RUNNER_TEMP/rc18.patch.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
      - name: Parse every RC18 PowerShell file
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force qualification/results | Out-Null
          $files=Get-ChildItem -Path scripts/windows -Filter *.ps1 -File | Sort-Object Name
          $errors=@()
          foreach($file in $files){
            $tokens=$null; $parseErrors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors) | Out-Null
            foreach($e in $parseErrors){$errors += [pscustomobject]@{file=$file.Name;message=$e.Message;line=$e.Extent.StartLineNumber;column=$e.Extent.StartColumnNumber}}
          }
          $status=if($files.Count -eq 15 -and $errors.Count -eq 0){'PASS'}else{'FAIL'}
          $out=[ordered]@{schemaVersion=1;stage='windows-powershell';status=$status;exactRc18=$true;runner='windows-latest';parsedFiles=$files.Count;expectedFiles=15;sourceCommit='${{ github.sha }}';generatedAt=(Get-Date).ToUniversalTime().ToString('o');errors=$errors}
          $out | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 qualification/results/rc18-exact-windows-powershell.json
          $out | ConvertTo-Json -Depth 8
          if($status -ne 'PASS'){exit 1}
      - name: Publish PowerShell evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path qualification/results/rc18-exact-windows-powershell.json)){throw 'PowerShell evidence missing'}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f qualification/results/rc18-exact-windows-powershell.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){git commit -m 'ci: publish exact RC18 PowerShell evidence [skip ci]'; git pull --rebase origin automation-platform-rc18-qualification; git push origin HEAD:automation-platform-rc18-qualification}
