name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d automation_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/automation_ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Prepare Supabase database stubs
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end
          $$;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            email text,
            created_at timestamptz not null default now()
          );
          SQL
      - name: Validate database migrations
        run: |
          set -euo pipefail
          for migration in database/*.sql; do
            echo "Applying $migration"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Validate database invariants
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            workspace_id uuid;
            connection_id uuid;
            actor_user_id uuid := gen_random_uuid();
          begin
            if has_schema_privilege('anon', 'app_private', 'USAGE') then
              raise exception 'anon must not have USAGE on app_private';
            end if;
            if has_schema_privilege('authenticated', 'app_private', 'USAGE') then
              raise exception 'authenticated must not have USAGE on app_private';
            end if;

            insert into auth.users (id, email)
            values (actor_user_id, 'ci-actor@example.test');

            insert into app_private.workspaces (name)
            values ('CI invariant workspace')
            returning id into workspace_id;

            begin
              insert into app_private.oauth_sessions (
                workspace_id,
                provider,
                state_hash,
                expires_at
              ) values (
                workspace_id,
                'instagram.meta.official',
                repeat('a', 64),
                now() + interval '10 minutes'
              );
              raise exception 'OAuth session without initiating actor was accepted';
            exception
              when not_null_violation then null;
            end;

            insert into app_private.oauth_sessions (
              workspace_id,
              initiated_by_user_id,
              provider,
              state_hash,
              expires_at
            ) values (
              workspace_id,
              actor_user_id,
              'instagram.meta.official',
              repeat('b', 64),
              now() + interval '10 minutes'
            );

            insert into app_private.provider_readiness_attestations (
              workspace_id,
              provider_key,
              check_key,
              status,
              confirmed_by_user_id
            ) values (
              workspace_id,
              'instagram.meta.official',
              'ci-readiness-check',
              'confirmed',
              actor_user_id
            );

            insert into app_private.channel_connections (
              workspace_id,
              channel,
              provider_key,
              provider_mode,
              external_account_id,
              auth_valid
            ) values (
              workspace_id,
              'instagram',
              'instagram.meta.official',
              'official',
              'ci-instagram-account',
              true
            ) returning id into connection_id;

            insert into app_private.messages (
              workspace_id,
              connection_id,
              idempotency_key,
              correlation_id,
              direction,
              message_type,
              dedupe_resource_key,
              delivery_state,
              payload
            ) values (
              workspace_id,
              connection_id,
              'ci-idem-private-1',
              gen_random_uuid(),
              'outbound',
              'instagram_comment_private_reply',
              'comment-claim-1',
              'QUEUED',
              '{}'::jsonb
            );

            begin
              insert into app_private.messages (
                workspace_id,
                connection_id,
                idempotency_key,
                correlation_id,
                direction,
                message_type,
                dedupe_resource_key,
                delivery_state,
                payload
              ) values (
                workspace_id,
                connection_id,
                'ci-idem-private-2',
                gen_random_uuid(),
                'outbound',
                'instagram_comment_private_reply',
                'comment-claim-1',
                'QUEUED',
                '{}'::jsonb
              );
              raise exception 'duplicate provider resource claim was accepted';
            exception
              when unique_violation then null;
            end;
          end
          $$;
          SQL
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
      - name: Build runtime containers
        run: |
          docker build --build-arg SERVICE=@automation/web -t automation-web:ci .
          docker build --build-arg SERVICE=@automation/worker-ingress -t automation-ingress:ci .
          docker build --build-arg SERVICE=@automation/worker-outbound -t automation-outbound:ci .
