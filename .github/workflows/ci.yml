name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d automation_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/automation_ci
      MIGRATION_RUNNER_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/automation_migrate_ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@9.15.4 --activate
      - name: Install dependencies from committed lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate HOST PASS local env guard
        shell: bash
        run: |
          set -euo pipefail
          if node scripts/hostpass-check.mjs apps/web/.env.local.example; then
            echo 'Example env unexpectedly passed with its password placeholder.' >&2
            exit 1
          fi

          sed 's#<AUTOMATION_WEB_PASSWORD>#ci-only-dummy-password-123456#' \
            apps/web/.env.local.example > /tmp/hostpass-valid.env
          node scripts/hostpass-check.mjs /tmp/hostpass-valid.env
      - name: Prepare Supabase database stubs
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
          end
          $$;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            email text,
            created_at timestamptz not null default now()
          );
          SQL
      - name: Validate database migrations
        run: |
          set -euo pipefail
          for migration in database/*.sql; do
            echo "Applying $migration"
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Validate production migration runner
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U postgres automation_migrate_ci
          psql "$MIGRATION_RUNNER_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            email text,
            created_at timestamptz not null default now()
          );
          SQL

          DATABASE_URL="$MIGRATION_RUNNER_DATABASE_URL" pnpm --filter @automation/storage-postgres migrate
          DATABASE_URL="$MIGRATION_RUNNER_DATABASE_URL" pnpm --filter @automation/storage-postgres migrate

          expected="$(find database -maxdepth 1 -type f -name '[0-9][0-9][0-9]_*.sql' | wc -l | tr -d ' ')"
          actual="$(psql "$MIGRATION_RUNNER_DATABASE_URL" -At -v ON_ERROR_STOP=1 -c 'select count(*) from app_private.schema_migrations')"
          test "$actual" = "$expected"
      - name: Validate database invariants
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            workspace_id uuid;
            connection_id uuid;
            actor_user_id uuid := gen_random_uuid();
            heartbeat_seen timestamptz;
          begin
            if has_schema_privilege('anon', 'app_private', 'USAGE') then
              raise exception 'anon must not have USAGE on app_private';
            end if;
            if has_schema_privilege('authenticated', 'app_private', 'USAGE') then
              raise exception 'authenticated must not have USAGE on app_private';
            end if;

            insert into auth.users (id, email)
            values (actor_user_id, 'ci-actor@example.test');

            insert into app_private.workspaces (name)
            values ('CI invariant workspace')
            returning id into workspace_id;

            begin
              insert into app_private.oauth_sessions (
                workspace_id,
                provider,
                state_hash,
                expires_at
              ) values (
                workspace_id,
                'instagram.meta.official',
                repeat('a', 64),
                now() + interval '10 minutes'
              );
              raise exception 'OAuth session without initiating actor was accepted';
            exception
              when not_null_violation then null;
            end;

            insert into app_private.oauth_sessions (
              workspace_id,
              initiated_by_user_id,
              provider,
              state_hash,
              expires_at
            ) values (
              workspace_id,
              actor_user_id,
              'instagram.meta.official',
              repeat('b', 64),
              now() + interval '10 minutes'
            );

            insert into app_private.provider_readiness_attestations (
              workspace_id,
              provider_key,
              check_key,
              status,
              confirmed_by_user_id
            ) values (
              workspace_id,
              'instagram.meta.official',
              'ci-readiness-check',
              'confirmed',
              actor_user_id
            );

            insert into app_private.worker_heartbeats (
              service,
              worker_id,
              metadata
            ) values (
              'worker-ingress',
              'ci-worker-1',
              '{"source":"ci"}'::jsonb
            );

            select last_seen_at into heartbeat_seen
            from app_private.worker_heartbeats
            where service = 'worker-ingress'
              and worker_id = 'ci-worker-1'
              and stopped_at is null;

            if heartbeat_seen is null then
              raise exception 'active worker heartbeat was not persisted';
            end if;

            update app_private.worker_heartbeats
            set stopped_at = now(), last_seen_at = now()
            where service = 'worker-ingress'
              and worker_id = 'ci-worker-1';

            if not exists (
              select 1
              from app_private.worker_heartbeats
              where service = 'worker-ingress'
                and worker_id = 'ci-worker-1'
                and stopped_at is not null
            ) then
              raise exception 'worker stop evidence was not persisted';
            end if;

            insert into app_private.channel_connections (
              workspace_id,
              channel,
              provider_key,
              provider_mode,
              external_account_id,
              auth_valid
            ) values (
              workspace_id,
              'instagram',
              'instagram.meta.official',
              'official',
              'ci-instagram-account',
              true
            ) returning id into connection_id;

            insert into app_private.messages (
              workspace_id,
              connection_id,
              idempotency_key,
              correlation_id,
              direction,
              message_type,
              dedupe_resource_key,
              delivery_state,
              payload
            ) values (
              workspace_id,
              connection_id,
              'ci-idem-private-1',
              gen_random_uuid(),
              'outbound',
              'instagram_comment_private_reply',
              'comment-claim-1',
              'QUEUED',
              '{}'::jsonb
            );

            begin
              insert into app_private.messages (
                workspace_id,
                connection_id,
                idempotency_key,
                correlation_id,
                direction,
                message_type,
                dedupe_resource_key,
                delivery_state,
                payload
              ) values (
                workspace_id,
                connection_id,
                'ci-idem-private-2',
                gen_random_uuid(),
                'outbound',
                'instagram_comment_private_reply',
                'comment-claim-1',
                'QUEUED',
                '{}'::jsonb
              );
              raise exception 'duplicate provider resource claim was accepted';
            exception
              when unique_violation then null;
            end;

            perform app_private.set_platform_public_config('legal_entity_name', 'CI Operator');
            perform app_private.set_platform_public_config('support_email', 'ci@example.test');
            perform app_private.set_instagram_platform_config(
              '1234567890',
              'https://example.test/oauth/authorize',
              'https://example.test/oauth/token',
              'multipart',
              'https://example.test/oauth/long-lived',
              '/ci/identity-probe'
            );

            if not exists (
              select 1
              from app_private.platform_public_config
              where config_key = 'support_email'
                and config_value = 'ci@example.test'
            ) then
              raise exception 'portable Setup Center public config bridge failed';
            end if;

            if not exists (
              select 1
              from app_private.provider_runtime_config
              where provider_key = 'instagram.meta.official'
                and app_id = '1234567890'
                and oauth_authorize_url = 'https://example.test/oauth/authorize'
                and oauth_token_url = 'https://example.test/oauth/token'
                and oauth_token_encoding = 'multipart'
                and long_lived_token_url = 'https://example.test/oauth/long-lived'
                and identity_probe_path = '/ci/identity-probe'
            ) then
              raise exception 'portable provider runtime config contract failed';
            end if;
          end
          $$;
          SQL
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose --profile ops config --quiet
          rm .env
      - name: Build runtime containers
        run: |
          docker build --build-arg SERVICE=@automation/storage-postgres -t automation-migrate:ci .
          docker build --build-arg SERVICE=@automation/web -t automation-web:ci .
          docker build --build-arg SERVICE=@automation/worker-ingress -t automation-ingress:ci .
          docker build --build-arg SERVICE=@automation/worker-outbound -t automation-outbound:ci .
      - name: Smoke test web container on Render port
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            --network host \
            -e SERVICE=@automation/web \
            -e PORT=10000 \
            -e APP_ORIGIN=http://127.0.0.1:10000 \
            -e DATABASE_URL="$TEST_DATABASE_URL" \
            automation-web:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health/live >/tmp/live.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs "$container_id"
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:10000/api/health/ready >/tmp/ready.json
          grep -q '"status":"ok"' /tmp/live.json
          grep -q '"status":"ready"' /tmp/ready.json
