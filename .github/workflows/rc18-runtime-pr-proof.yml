name: RC18 Runtime PR Proof

on:
  pull_request:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - 'qualification/runtime-pr-trigger.txt'
      - '.github/workflows/rc18-runtime-pr-proof.yml'

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact RC18 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*)
          test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"
          rem=$((${#encoded}%4)); [ "$rem" -eq 0 ] || [ "$rem" -eq 2 ] || [ "$rem" -eq 3 ]
          [ "$rem" -ne 2 ] || encoded="${encoded}=="
          [ "$rem" -ne 3 ] || encoded="${encoded}="
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"
          git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f apps/worker-automation/package.json
      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          pnpm install --frozen-lockfile
      - name: Start PostgreSQL and migrate
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-pr-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 60); do docker exec rc18-pr-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break; sleep 1; done
          docker exec rc18-pr-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          docker exec rc18-pr-db psql -U postgres -d automation_runtime -Atqc 'select count(*)||"|"||max(version) from app_private.schema_migrations;'
      - name: Build
        run: pnpm build
      - name: Start worker and web
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='github-pr-runtime-proof' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker.log" 2>&1 & echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 & echo $! > "$RUNNER_TEMP/web.pid"
      - name: Wait for runtime health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            live=$(curl -sS -o /tmp/live -w '%{http_code}' "$APP_ORIGIN/api/health/live" || true)
            ready=$(curl -sS -o /tmp/ready -w '%{http_code}' "$APP_ORIGIN/api/health/ready" || true)
            local=$(curl -sS -o /tmp/local -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" || true)
            heartbeat=$(docker exec rc18-pr-db psql -U postgres -d automation_runtime -Atqc "select coalesce((select runtime_state||'|'||(last_seen_at>=now()-interval '30 seconds')::text from app_private.worker_heartbeats where worker_kind='worker-automation' and worker_id='github-pr-runtime-proof' order by last_seen_at desc limit 1),'missing');" || true)
            echo "attempt=$i live=$live ready=$ready local=$local heartbeat=$heartbeat"
            if [ "$live" = 200 ] && [ "$ready" = 200 ] && [ "$local" = 200 ] && [ "$heartbeat" = 'active|true' ]; then exit 0; fi
            sleep 1
          done
          echo '--- live ---'; cat /tmp/live || true
          echo '--- ready ---'; cat /tmp/ready || true
          echo '--- local ---'; cat /tmp/local || true
          echo '--- worker log ---'; tail -200 "$RUNNER_TEMP/worker.log" || true
          echo '--- web log ---'; tail -200 "$RUNNER_TEMP/web.log" || true
          docker exec rc18-pr-db psql -U postgres -d automation_runtime -x -c "select * from app_private.worker_heartbeats order by last_seen_at desc limit 5;" || true
          exit 1
      - name: Run Test Center and require runtime browser database
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"
          OUT="$RUNNER_TEMP/runs"
          mkdir -p "$OUT"
          export BROWSER_EXECUTABLE="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          set +e
          node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin "$APP_ORIGIN"
          runner=$?
          set -e
          node - "$OUT/$RUN_ID/status.json" <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const m=new Map(s.steps.map(x=>[x.id,x]));const checks={};for(const id of ['http','browser','database'])checks[id]={state:m.get(id)?.state,message:m.get(id)?.message};console.log(JSON.stringify({battery:s.state,checks},null,2));for(const id of ['http','browser','database'])if(m.get(id)?.state!=='PASS')throw new Error(`${id}:${m.get(id)?.state||'MISSING'}`);
          NODE
          echo "runner_exit=$runner"
      - name: Logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- worker ---'; tail -250 "$RUNNER_TEMP/worker.log" || true
          echo '--- web ---'; tail -250 "$RUNNER_TEMP/web.log" || true
          docker logs --tail 200 rc18-pr-db || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid" || kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null || true
          test ! -f "$RUNNER_TEMP/worker.pid" || kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null || true
          docker rm -f rc18-pr-db >/dev/null 2>&1 || true
