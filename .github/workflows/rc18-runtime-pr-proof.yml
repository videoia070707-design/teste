name: RC18 Exact Local Qualification PR

on:
  pull_request:
    branches:
      - automation-platform-rc18-qualification
    paths:
      - 'qualification/runtime-pr-trigger.txt'
      - '.github/workflows/rc18-runtime-pr-proof.yml'

permissions:
  contents: read

jobs:
  toolchain:
    name: Stage 1 - exact toolchain typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - name: Apply exact RC18 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*); test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"; rem=$((${#encoded}%4))
          [ "$rem" -ne 2 ] || encoded="${encoded}=="; [ "$rem" -ne 3 ] || encoded="${encoded}="; [ "$rem" -ne 1 ]
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"; git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
          test -f scripts/automation-closure-stage-tracker-check.mjs
      - name: Exact dependency and build qualification
        shell: bash
        env: { CI: 'true', NEXT_TELEMETRY_DISABLED: '1' }
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          test "$(pnpm --version)" = '9.15.4'
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build

  powershell:
    name: Stage 2 - exact Windows PowerShell parser
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact RC18 patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*); test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}" | tr -d '\r\n\t ')"; rem=$((${#encoded}%4))
          [ "$rem" -ne 2 ] || encoded="${encoded}=="; [ "$rem" -ne 3 ] || encoded="${encoded}="; [ "$rem" -ne 1 ]
          printf '%s' "$encoded" | base64 --decode > "$RUNNER_TEMP/rc18.gz"
          gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"; git apply --binary "$RUNNER_TEMP/rc18.patch"
          test -f database/078_transactional_local_upgrade.sql
      - name: Parse all exact RC18 PowerShell files
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem scripts/windows -Filter *.ps1 -File | Sort-Object Name)
          if($files.Count -ne 15){throw "Expected 15 files, got $($files.Count)"}
          $errors=@()
          foreach($file in $files){$tokens=$null;$parseErrors=$null;[System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)|Out-Null;foreach($e in $parseErrors){$errors += "$($file.Name): $($e.Message)"}}
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_};exit 1}
          Write-Host "RC18 exact PowerShell PASS: $($files.Count)/15"

  runtime-browser:
    name: Stage 3 - exact runtime browser hydration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ORIGIN: 'http://127.0.0.1:3000'
      LOCAL_TEST_MODE: 'true'
      DATABASE_URL: 'postgresql://postgres:postgres@127.0.0.1:55432/automation_runtime'
      DATABASE_POOL_MAX: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - name: Apply exact RC18 patch and install
        shell: bash
        run: |
          set -euo pipefail; shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*); test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}"|tr -d '\r\n\t ')"; rem=$((${#encoded}%4)); [ "$rem" -ne 2 ]||encoded="${encoded}=="; [ "$rem" -ne 3 ]||encoded="${encoded}="; [ "$rem" -ne 1 ]
          printf '%s' "$encoded"|base64 --decode > "$RUNNER_TEMP/rc18.gz"; gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"; git apply --binary "$RUNNER_TEMP/rc18.patch"; test -f database/078_transactional_local_upgrade.sql
          corepack enable; corepack prepare pnpm@9.15.4 --activate; pnpm install --frozen-lockfile; pnpm build
      - name: Start PostgreSQL and migrate through 078
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name rc18-pr-runtime-db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=automation_runtime -p 55432:5432 postgres:17-alpine
          for i in $(seq 1 60); do docker exec rc18-pr-runtime-db pg_isready -U postgres -d automation_runtime >/dev/null 2>&1 && break; sleep 1; done
          docker exec rc18-pr-runtime-db pg_isready -U postgres -d automation_runtime
          pnpm --filter @automation/storage-postgres migrate
          latest="$(docker exec rc18-pr-runtime-db psql -U postgres -d automation_runtime -Atqc 'select max(version) from app_private.schema_migrations;')"; echo "$latest"; test "$latest" = '078_transactional_local_upgrade.sql'
      - name: Start runtime and prove HTTP + hydration
        shell: bash
        run: |
          set -euo pipefail
          nohup env DATABASE_URL="$DATABASE_URL" AUTOMATION_WORKER_ID='rc18-pr-runtime' pnpm --filter @automation/worker-automation start > "$RUNNER_TEMP/worker.log" 2>&1 & echo $! > "$RUNNER_TEMP/worker.pid"
          nohup env DATABASE_URL="$DATABASE_URL" DATABASE_POOL_MAX="$DATABASE_POOL_MAX" APP_ORIGIN="$APP_ORIGIN" LOCAL_TEST_MODE="$LOCAL_TEST_MODE" PORT=3000 pnpm --filter @automation/web start > "$RUNNER_TEMP/web.log" 2>&1 & echo $! > "$RUNNER_TEMP/web.pid"
          ok=0
          for i in $(seq 1 120); do live=$(curl -sS -o /tmp/live -w '%{http_code}' "$APP_ORIGIN/api/health/live" 2>/dev/null||true); ready=$(curl -sS -o /tmp/ready -w '%{http_code}' "$APP_ORIGIN/api/health/ready" 2>/dev/null||true); boot=$(curl -sS -o /tmp/boot -w '%{http_code}' "$APP_ORIGIN/api/runtime/local-status?probe=boot" 2>/dev/null||true); if [ "$live" = 200 ]&&[ "$ready" = 200 ]&&[ "$boot" = 200 ];then ok=1;break;fi;sleep 1;done
          if [ "$ok" != 1 ];then cat /tmp/live||true;cat /tmp/ready||true;cat /tmp/boot||true;tail -200 "$RUNNER_TEMP/web.log"||true;tail -200 "$RUNNER_TEMP/worker.log"||true;exit 1;fi
          BROWSER="$(command -v google-chrome-stable||command -v google-chrome||command -v chromium||command -v chromium-browser||true)"; test -n "$BROWSER"; echo "browser=$BROWSER"
          node scripts/browser-release-check.mjs --origin "$APP_ORIGIN" --browser "$BROWSER" --output "$RUNNER_TEMP/browser.json"
          cat "$RUNNER_TEMP/browser.json"
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNNER_TEMP/web.pid"||kill "$(cat "$RUNNER_TEMP/web.pid")" 2>/dev/null||true
          test ! -f "$RUNNER_TEMP/worker.pid"||kill "$(cat "$RUNNER_TEMP/worker.pid")" 2>/dev/null||true
          docker rm -f rc18-pr-runtime-db >/dev/null 2>&1||true

  database-drills:
    name: Stage 4 - exact Docker database drills
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.16.0' }
      - name: Apply exact RC18 patch and install
        shell: bash
        run: |
          set -euo pipefail; shopt -s nullglob
          parts=(.ci/rc18-core.patch.b64.*); test "${#parts[@]}" -eq 12
          encoded="$(cat "${parts[@]}"|tr -d '\r\n\t ')"; rem=$((${#encoded}%4)); [ "$rem" -ne 2 ]||encoded="${encoded}=="; [ "$rem" -ne 3 ]||encoded="${encoded}="; [ "$rem" -ne 1 ]
          printf '%s' "$encoded"|base64 --decode > "$RUNNER_TEMP/rc18.gz"; gzip -dc "$RUNNER_TEMP/rc18.gz" > "$RUNNER_TEMP/rc18.patch"
          git apply --binary --check "$RUNNER_TEMP/rc18.patch"; git apply --binary "$RUNNER_TEMP/rc18.patch"; test -f database/078_transactional_local_upgrade.sql
          corepack enable; corepack prepare pnpm@9.15.4 --activate; pnpm install --frozen-lockfile
      - name: Run official RC18 database deep check
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="tb-$(date +%s%3N)-$(openssl rand -hex 4)"; OUT="$RUNNER_TEMP/db-runs"; mkdir -p "$OUT"
          set +e; node scripts/test-battery-runner.mjs --run-id "$RUN_ID" --output-root "$OUT" --origin http://127.0.0.1:9; runner=$?; set -e
          STATUS="$OUT/$RUN_ID/status.json"; test -f "$STATUS"
          node - "$STATUS" <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const d=(s.steps||[]).find(x=>x.id==='database');console.log(JSON.stringify(d,null,2));if(d?.state!=='PASS')throw new Error(`database:${d?.state||'MISSING'}:${d?.message||''}`);
          NODE
          echo "battery overall exit intentionally may be nonzero because no dashboard: $runner"
