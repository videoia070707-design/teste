name: Free Web Blueprint

on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/free-web-blueprint.yml
      - Dockerfile
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/free-web-blueprint.yml
      - Dockerfile

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-cost Blueprint invariants
        shell: ruby {0}
        run: |
          require "yaml"
          data = YAML.safe_load_file("render.yaml", aliases: true)
          abort "render.yaml must contain only services" unless data.is_a?(Hash) && data.keys.all? { |key| key == "services" }
          services = data.fetch("services")
          abort "exactly one Render service is allowed in free G3" unless services.is_a?(Array) && services.size == 1

          service = services.first
          abort "G3 Render resource must be a web service" unless service["type"] == "web"
          abort "G3 Render web must remain free" unless service["plan"] == "free"
          abort "paid/predeploy operations are forbidden in free G3" if service.key?("preDeployCommand")
          abort "auto deploy must wait for checks" unless service["autoDeployTrigger"] == "checksPass"
          abort "readiness health check required" unless service["healthCheckPath"] == "/api/health/ready"

          envs = Array(service["envVars"])
          keys = envs.filter_map { |entry| entry["key"] }
          forbidden = %w[
            PROVIDER_SECRET_KEYS_JSON
            PROVIDER_SECRET_CURRENT_KEY_VERSION
            META_APP_SECRET
            META_WEBHOOK_VERIFY_TOKEN
            META_WEBHOOK_SIGNATURE_HEADER
            META_APP_ID
            INSTAGRAM_GRAPH_BASE_URL
            INSTAGRAM_GRAPH_API_VERSION
            INSTAGRAM_IDENTITY_PROBE_PATH
            INSTAGRAM_OAUTH_AUTHORIZE_URL
            INSTAGRAM_OAUTH_TOKEN_URL
            INSTAGRAM_OAUTH_TOKEN_ENCODING
            INSTAGRAM_LONG_LIVED_TOKEN_URL
            LEGAL_ENTITY_NAME
            SUPPORT_EMAIL
          ]
          leaked = keys & forbidden
          abort "Supabase-owned provider/legal config leaked back into Render config: #{leaked.inspect}" unless leaked.empty?

          required = %w[
            SERVICE APP_ORIGIN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            DATABASE_URL DATABASE_POOL_MAX
          ]
          missing = required - keys
          abort "required web env declarations missing: #{missing.inspect}" unless missing.empty?

          database_url = envs.find { |entry| entry["key"] == "DATABASE_URL" }
          abort "DATABASE_URL must remain an operator-supplied secret" unless database_url && database_url["sync"] == false

          publishable_key = envs.find { |entry| entry["key"] == "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" }
          publishable_value = publishable_key && publishable_key["value"].to_s
          abort "modern Supabase publishable key is required" unless publishable_value.start_with?("sb_publishable_")
          abort "legacy anon JWT must not be committed as the publishable key" if publishable_value.start_with?("eyJ")

          database_pool = envs.find { |entry| entry["key"] == "DATABASE_POOL_MAX" }
          abort "free web database pool must remain capped at 3" unless database_pool && database_pool["value"].to_s == "3"
