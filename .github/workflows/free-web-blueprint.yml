name: Free Web Blueprint

on:
  push:
    branches: [main]
    paths:
      - render.yaml
      - .github/workflows/free-web-blueprint.yml
      - Dockerfile
  pull_request:
    paths:
      - render.yaml
      - .github/workflows/free-web-blueprint.yml
      - Dockerfile

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate zero-cost Blueprint invariants
        shell: ruby {0}
        run: |
          require "yaml"
          data = YAML.safe_load_file("render.yaml", aliases: true)
          abort "render.yaml must contain only services" unless data.is_a?(Hash) && data.keys.all? { |key| key == "services" }
          services = data.fetch("services")
          abort "exactly one Render service is allowed in free G3" unless services.is_a?(Array) && services.size == 1

          service = services.first
          abort "G3 Render resource must be a web service" unless service["type"] == "web"
          abort "G3 Render web must remain free" unless service["plan"] == "free"
          abort "paid/predeploy operations are forbidden in free G3" if service.key?("preDeployCommand")
          abort "auto deploy must wait for checks" unless service["autoDeployTrigger"] == "checksPass"
          abort "readiness health check required" unless service["healthCheckPath"] == "/api/health/ready"

          envs = Array(service["envVars"])
          keys = envs.filter_map { |entry| entry["key"] }
          forbidden = %w[
            PROVIDER_SECRET_KEYS_JSON
            PROVIDER_SECRET_CURRENT_KEY_VERSION
            META_WEBHOOK_VERIFY_TOKEN
          ]
          leaked = keys & forbidden
          abort "Supabase/Vault-owned secrets leaked back into Render config: #{leaked.inspect}" unless leaked.empty?

          required = %w[
            SERVICE APP_ORIGIN NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            DATABASE_URL META_APP_ID META_APP_SECRET
          ]
          missing = required - keys
          abort "required web env declarations missing: #{missing.inspect}" unless missing.empty?
